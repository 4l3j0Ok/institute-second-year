services:
  backend:
    image: alejoide/instituto-concesionaria-backend:latest
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./config/backend/.env
    ports:
      - "8000:8000"

  frontend:
    image: alejoide/instituto-concesionaria-frontend:latest
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "4321:4321"
    restart: unless-stopped
    env_file:
      - ./config/frontend/.env
