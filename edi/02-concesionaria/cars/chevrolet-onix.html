<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link rel="stylesheet" href="../styles/common.css" />
    <link rel="stylesheet" href="../styles/cars.css" />
    <script type="module" src="../modules/cars.js"></script>
    <script type="module">
        import { handleClick } from '../modules/contact.js';
        window.handleClick = handleClick;
    </script>
</head>

<body>
    <nav>
        <div class="nav-content">
            <div class="logo">
                <a href="/">
                    <img class="logo-image" src="../assets/images/logo-black-outline.webp"
                        alt="Logo Premium Quality" /></a>
                <h1><a href="/">Premium Quality</a></h1>
            </div>
            <div class="options">
                <a href="/">Página Principal</a>
                <a href="/financing.html">Financiación</a>
                <a href="/offers.html">Ofertas</a>
            </div>
        </div>
    </nav>
    <main>
        <section class="car">
            <script type="module">
                import { displayCar } from '../modules/cars.js';
                displayCar();
            </script>
        </section>
        <section class="contact">
            <h2>Contacto</h2>
            <form class="contact-form">
                <label for="name">Nombre y apellido:</label>
                <input type="text" name="name" placeholder="Juan Pérez" required id="name">
                <label for="message">Mensaje:</label>
                <textarea name="message" placeholder="Hola, quisiera contactarme por..." required
                    id="message"></textarea>
                <button type="submit" onclick="handleClick(event)">Enviar</button>
            </form>
        </section>
    </main>
    <footer>
        <div class="footer-content">
            <p>© 2021 Premium Quality.<br>Todos los derechos reservados.</p>
        </div>
    </footer>
</body>

</html>
