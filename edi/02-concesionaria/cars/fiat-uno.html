<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link rel="stylesheet" href="../style.css" />
</head>

<body>
    <nav>
        <div class="nav-content">
            <img src="./assets/images/logo-white-outline.webp" alt="Logo Premium Quality" class="logo">
            <div class="options">
                <a href="#">Página Principal</a>
                <a href="#">Financiación</a>
                <a href="#">Ofertas</a>
                <a href="#">Financiación</a>
            </div>
        </div>
    </nav>
    <main>
        <section class="car-info">
            <div class="car-image">
                <img src="{ruta de la imagen}" alt="{nombre del auto}">
            </div>
            <div class="car-details">
                <h1>{nombre del auto}</h1>
                <p>{descripción del auto}</p>
                <p>Precio: {precio del auto}</p>
            </div>
        </section>
    </main>
    <footer>
        <div class="content">
            <p>© 2021 Premium Quality.<br>Todos los derechos reservados.</p>
        </div>
    </footer>
</body>

</html>
