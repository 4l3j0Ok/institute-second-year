<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="./cars.css" />
</head>

<body>
    <nav>
        <div class="nav-content">
            <img src="./assets/images/logo-white-outline.webp" alt="Logo Premium Quality" class="logo">
            <div class="options">
                <a href="#">Página Principal</a>
                <a href="#">Financiación</a>
                <a href="#">Ofertas</a>
                <a href="#">Financiación</a>
            </div>
        </div>
    </nav>
    <main>
        <section class="car-info">
            <div class="car-image">
                <img src="../assets/images/ford-ka.webp" alt="Ford Ka">
            </div>
            <div class="car-actions">
                <h1>Ford Ka</h1>
                <p>Precio: {precio del auto}</p>
            </div>
        </section>
        <section class="car-details">
            <h2>Detalles del auto</h2>
            <p>Descripción: {descripción del auto}</p>
            <p>Características: {características del auto}</p>
    </main>
    <footer>
        <div class="content">
            <p>© 2021 Premium Quality.<br>Todos los derechos reservados.</p>
        </div>
    </footer>
</body>

</html>
