<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link rel="stylesheet" href="./styles/common.css" />
    <link rel="stylesheet" href="./styles/index.css" />
    <script type="module" src="./modules/catalog.js"></script>
    <script type="module">
        import { handleClick } from './modules/contact.js';
        window.handleClick = handleClick;
    </script>
</head>

<body>
    <nav>
        <div class="nav-content">
            <a href="/" class="logo"><img class="logo" src="./assets/images/logo-white-outline.webp"
                    alt="Logo Premium Quality" /></a>
            <div class="options">
                <a href="#">Página Principal</a>
                <a href="#">Financiación</a>
                <a href="#">Ofertas</a>
            </div>
        </div>
    </nav>
    <main>
        <section class="hero">
            <h2 class="title">Catálogo de autos</h2>
            <p class="description">Encontrá el auto de tus sueños</p>
        </section>
        <div class="search">
            <input type="search">
            <button>Buscar</button>
        </div>
        <section class="catalog">
            <script type="module">
                import { displayCars } from './modules/catalog.js';
                displayCars();
            </script>
        </section>
    </main>
    <section class="contact">
        <h2>Contacto</h2>
        <form class="contact-form">
            <label for="name">Nombre y apellido:</label>
            <input type="text" name="name" placeholder="Juan Pérez" required id="name">
            <label for="message">Mensaje:</label>
            <textarea name="message" placeholder="Hola, quisiera contactarme por..." required id="message"></textarea>
            <button type="submit" onclick="handleClick(event)">Enviar</button>
        </form>
    </section>
    <footer>
        <div class="footer-content">
            <p>© 2021 Premium Quality.<br>Todos los derechos reservados.</p>
        </div>
    </footer>
</body>

</html>
