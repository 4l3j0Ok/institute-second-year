<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link rel="stylesheet" href="./styles/common.css" />
    <link rel="stylesheet" href="./styles/index.css" />
    <script type="module" src="./modules/catalog.js"></script>
    <script type="module">
        import { handleClick } from './modules/contact.js';
        window.handleClick = handleClick;
    </script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
</head>

<body>
    <nav>
        <div class="nav-content">
            <div class="logo">
                <a href="/">
                    <img class="logo-image" src="./assets/images/logo-black-outline.webp"
                        alt="Logo Premium Quality" /></a>
                <h1><a href="/">Premium Quality</a></h1>
            </div>
            <div class="options">
                <a href="#">Página Principal</a>
                <a href="#">Financiación</a>
                <a href="#">Ofertas</a>
            </div>
        </div>
    </nav>
    <main>
        <section class="hero">
            <video autoplay muted loop class="hero-video">
                <source src="./assets/videos/hero.webm" type="video/webm">
                Tu navegador no soporta el video.
            </video>
            <div class="hero-text">
                <h1>Concesionaria Premium Quality</h1>
                <p>Tu auto ideal te está esperando.</p>
            </div>
        </section>
        <section class="services">
            <article class="service-card">
                <div class="service-car">
                    <img src="./assets/images/white-toyota-transparent.png" alt="Auto Toyota" />
                </div>
                <div class="description">
                    <h3>Financiá tu auto</h3>
                    <p>Ofrecemos planes de financiación adaptados a tus necesidades.</p>
                    <button>Más información</button>
                </div>
            </article>
        </section>
        <section class="catalog">
            <h2>Catálogo</h2>
            <div class="catalog-content">
                <button class="arrow-button" id="prev-button"><iconify-icon
                        icon="bxs:left-arrow"></iconify-icon></button>
                <div class="catalog-cars">
                    <script type="module">
                        import { displayCars } from './modules/catalog.js';
                        displayCars();
                    </script>
                </div>
                <button class="arrow-button" id="next-button"><iconify-icon
                        icon="bxs:right-arrow"></iconify-icon></button>
            </div>
        </section>
        <section class="contact">
            <h2>Contacto</h2>
            <form class="contact-form">
                <label for="name">Nombre y apellido:</label>
                <input type="text" name="name" placeholder="Juan Pérez" required id="name">
                <label for="message">Mensaje:</label>
                <textarea name="message" placeholder="Hola, quisiera contactarme por..." required
                    id="message"></textarea>
                <button type="submit" onclick="handleClick(event)">Enviar</button>
            </form>
        </section>
    </main>
    <footer>
        <div class="footer-content">
            <p>© 2025 Premium Quality.<br>Todos los derechos reservados.</p>
        </div>
    </footer>
</body>

</html>
